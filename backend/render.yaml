services:
  - type: web
    name: posts-ingest-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: posts-db
          property: connectionString
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        sync: false

databases:
  - name: posts-db
    plan: free
